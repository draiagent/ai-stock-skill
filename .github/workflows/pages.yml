name: Deploy site to GitHub Pages

# 只發佈 site/ 資料夾裡的靜態檔，不在這裡抓行情或跑計算。
# site/data/latest.json 目前是模擬資料；換成真實資料前請先確認行情對外授權。
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: 檢查資料檔是合法 JSON 且有標示模式
        run: python3 -c "import json;d=json.load(open('site/data/latest.json',encoding='utf-8'));assert d['schema']=='ai-stock-site/1' and d['mode'] in ('MOCK','REAL_API'),d.get('mode');print(d['mode'],len(d['stocks']),'stocks')"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
